    class EmergencyAudioEngine {
      constructor() {
        this.ctx = null;
        this.osc = null;
        this.gain = null;
        this.isPlaying = false;
        this.timer = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playBeep(freq = 880, dur = 120) {
        this.init();
        if (!this.ctx) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, this.ctx.currentTime);
          g.gain.setValueAtTime(0.2, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur / 1000);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          o.stop(this.ctx.currentTime + dur / 1000);
        } catch(e) {}
      }
      startSiren() {
        if (this.isPlaying) return;
        this.init();
        if (!this.ctx) return;
        try {
          this.isPlaying = true;
          this.osc = this.ctx.createOscillator();
          this.gain = this.ctx.createGain();
          this.osc.type = 'sawtooth';
          this.gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          this.osc.connect(this.gain);
          this.gain.connect(this.ctx.destination);
          let freq = 550;
          let up = true;
          this.osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          this.osc.start();
          this.timer = setInterval(() => {
            if (!this.ctx || !this.osc) return;
            if (up) { freq += 45; if (freq >= 1200) up = false; }
            else { freq -= 45; if (freq <= 500) up = true; }
            this.osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          }, 35);
        } catch(e) {}
      }
      stopSiren() {
        if (!this.isPlaying) return;
        this.isPlaying = false;
        if (this.timer) clearInterval(this.timer);
        if (this.osc) {
          try { this.osc.stop(); this.osc.disconnect(); } catch(e) {}
          this.osc = null;
        }
      }
      speak(text, lang = 'en') {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
        utt.rate = 0.95;
        window.speechSynthesis.speak(utt);
      }
      stopSpeaking() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }
    const audio = new EmergencyAudioEngine();

                {/* 2. AUTO-SLIDING DYNAMIC DISASTER ALERT CAROUSEL */}
                <div className="relative rounded-3xl overflow-hidden glass-red p-4 shadow-2xl border border-red-600/50">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-[10px] font-black uppercase tracking-widest bg-red-600 text-white px-2.5 py-0.5 rounded-full animate-pulse flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                      LIVE ALERT ({carouselIdx + 1}/{alertKeys.length})
                    </span>
                    <span className="text-[10px] font-mono text-red-300 font-bold">IMD / NDMA Broadcast</span>
                  </div>

                  <h2 className="text-lg font-black text-white flex items-center gap-2">
                    <span>{activeAlert.icon}</span>
                    <span>{lang === 'en' ? activeAlert.name : activeAlert.nameHi}</span>
                  </h2>

                  <p className="text-xs text-red-200 mt-1 leading-relaxed line-clamp-2">
                    {activeAlert.whatHappened}
                  </p>

                  <div className="flex items-center gap-2 mt-3 pt-2 border-t border-red-800/40">
                    <button
                      onClick={() => {
                        setSelectedDisaster(activeAlert.id);
                        setTab('emergency');
                      }}
                      className="flex-1 py-2.5 px-3 rounded-xl bg-red-600 hover:bg-red-500 text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-lg shadow-red-600/40 transition-all"
                    >
                      <span>{lang === 'en' ? 'What To Do Now' : 'तुरंत सुरक्षा निर्देश'}</span>
                      <span>→</span>
                    </button>
                    <button
                      onClick={() => handleVoiceGuidance(activeAlert.id)}
                      className="py-2.5 px-3 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 flex items-center gap-1"
                    >
                      🔊 {speaking ? 'Stop' : 'Voice'}
                    </button>
                  </div>
                </div>

                {/* 3. HOME DASHBOARD LEVEL 1: LOCATION, RISK & SENSORS */}
                <div className="glass-panel rounded-2xl p-4 space-y-3">
                  <div className="flex justify-between items-center">
                    <div>
                      <div className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Your Current Location</div>
                      <div className="text-sm font-extrabold text-white flex items-center gap-1 mt-0.5">
                        <span className="text-red-400">📍</span>
                        <span>{userLocation}</span>
                      </div>
                    </div>

                    <div className="text-right">
                      <div className="text-[10px] font-bold text-slate-400 uppercase">Current Risk</div>
                      <span className="text-xs font-black text-red-400 bg-red-950 px-2.5 py-0.5 rounded-full border border-red-800 inline-block mt-0.5">
                        {locationRiskLevel}
                      </span>
                    </div>
                  </div>

                  {/* Real-time Weather & Sensor Strip */}
                  <div className="grid grid-cols-4 gap-2 pt-2 border-t border-slate-800/80 text-center font-mono">
                    <div className="bg-slate-900/90 rounded-xl p-2 border border-slate-800">
                      <div className="text-[9px] text-slate-400">Rainfall</div>
                      <div className="text-xs font-bold text-blue-400">{rainMm} mm/h</div>
                    </div>
                    <div className="bg-slate-900/90 rounded-xl p-2 border border-slate-800">
                      <div className="text-[9px] text-slate-400">River Stage</div>
                      <div className="text-xs font-bold text-cyan-400">205.85m</div>
                    </div>
                    <div className="bg-slate-900/90 rounded-xl p-2 border border-slate-800">
                      <div className="text-[9px] text-slate-400">Wind Gust</div>
                      <div className="text-xs font-bold text-amber-400">{windKmh} km/h</div>
                    </div>
                    <div className="bg-slate-900/90 rounded-xl p-2 border border-slate-800">
                      <div className="text-[9px] text-slate-400">Temp / UV</div>
                      <div className="text-xs font-bold text-rose-400">{tempC}°C</div>
                    </div>
                  </div>
                </div>

                {/* 4. BIG EMERGENCY ACTION BUTTON */}
                <button
                  onClick={() => setTab('emergency')}
                  className="w-full p-4 rounded-2xl bg-gradient-to-r from-red-600 via-rose-600 to-red-700 text-white font-black text-base flex items-center justify-between shadow-2xl shadow-red-600/40 active:scale-98 transition-all border border-red-400/30"
                >
                  <div className="flex items-center gap-3">
                    <span className="text-3xl animate-bounce">🚨</span>
                    <div className="text-left">
                      <div className="uppercase tracking-wide font-black">{lang === 'en' ? "I'M IN AN EMERGENCY" : "🚨 मैं आपातकाल में हूँ"}</div>
                      <div className="text-xs font-normal text-red-100/80">{lang === 'en' ? 'One tap instant disaster protocols' : 'भूकंप, बाढ़, आग तुरंत एक्शन'}</div>
                    </div>
                  </div>
                  <span className="text-xl font-bold">→</span>
                </button>

                {/* 5. QUICK-ACTION 6 GRID SHELF */}
                <div className="grid grid-cols-2 gap-2.5">
                  <button onClick={() => setSubView('ai_predict')} className="p-3.5 rounded-2xl bg-[#141728] border border-purple-800/60 text-left hover:border-purple-500 transition-all shadow-md group">
                    <div className="flex justify-between items-start mb-1">
                      <span className="text-2xl group-hover:scale-110 transition-transform">🤖</span>
                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-purple-950 text-purple-300 border border-purple-800">{riskScore}% Risk</span>
                    </div>
                    <div className="text-xs font-bold text-white">AI Risk Predictor</div>
                    <div className="text-[10px] text-slate-400">Multi-sensor 0-100 gauge</div>
                  </button>

                  <button onClick={() => setSubView('vision_scan')} className="p-3.5 rounded-2xl bg-[#141728] border border-blue-800/60 text-left hover:border-blue-500 transition-all shadow-md group">
                    <div className="flex justify-between items-start mb-1">
                      <span className="text-2xl group-hover:scale-110 transition-transform">📸</span>
                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-blue-950 text-blue-300 border border-blue-800">Vision</span>
                    </div>
                    <div className="text-xs font-bold text-white">AI Camera Scan</div>
                    <div className="text-[10px] text-slate-400">Flood depth & damage scan</div>
                  </button>

                  <button onClick={() => setSubView('evac_routes')} className="p-3.5 rounded-2xl bg-[#141728] border border-emerald-800/60 text-left hover:border-emerald-500 transition-all shadow-md group">
                    <div className="flex justify-between items-start mb-1">
                      <span className="text-2xl group-hover:scale-110 transition-transform">🧭</span>
                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-emerald-950 text-emerald-300 border border-emerald-800">Detour</span>
                    </div>
                    <div className="text-xs font-bold text-white">Evacuation Routes</div>
                    <div className="text-[10px] text-slate-400">Live corridor to shelters</div>
                  </button>

                  <button onClick={() => setSosOpen(true)} className="p-3.5 rounded-2xl bg-gradient-to-br from-red-950 to-[#181116] border border-red-800 text-left shadow-lg animate-pulse">
                    <div className="flex justify-between items-start mb-1">
                      <span className="text-2xl">🆘</span>
                      <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-red-600 text-white">SOS</span>
                    </div>
                    <div className="text-xs font-black text-red-300">SOS Emergency Hub</div>
                    <div className="text-[10px] text-red-300/80">Siren & GPS pin dispatch</div>
                  </button>
                </div>

                {/* 6. DIRECT 24x7 HELPLINES */}
                <div className="p-3 rounded-2xl bg-slate-900/90 border border-slate-800 space-y-2">
                  <div className="text-[11px] font-bold text-slate-400 uppercase tracking-wider">⚡ Immediate Emergency Speed Dials</div>
                  <div className="grid grid-cols-4 gap-2 text-center text-xs font-bold font-mono">
                    <a href="tel:112" className="p-2 bg-red-950/70 text-red-300 border border-red-800/60 rounded-xl">112<br/><span className="text-[9px] text-slate-400 font-normal">All Dispatch</span></a>
                    <a href="tel:108" className="p-2 bg-emerald-950/70 text-emerald-300 border border-emerald-800/60 rounded-xl">108<br/><span className="text-[9px] text-slate-400 font-normal">Ambulance</span></a>
                    <a href="tel:101" className="p-2 bg-orange-950/70 text-orange-300 border border-orange-800/60 rounded-xl">101<br/><span className="text-[9px] text-slate-400 font-normal">Fire Dept</span></a>
                    <a href="tel:1078" className="p-2 bg-blue-950/70 text-blue-300 border border-blue-800/60 rounded-xl">1078<br/><span className="text-[9px] text-slate-400 font-normal">NDRF Boats</span></a>
                  </div>
                </div>
              </div>
            )}

            {/* ========================================== */}
            {/* TAB 2: EMERGENCY PROTOCOLS & ACTION CARDS */}
            {/* ========================================== */}
            {!subView && tab === 'emergency' && (
              <div className="space-y-4 animate-fadeIn">
                <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                  {Object.values(DISASTERS_MAP).map(d => (
                    <button
                      key={d.id}
                      onClick={() => setSelectedDisaster(d.id)}
                      className={`px-3 py-2 rounded-xl text-xs font-bold whitespace-nowrap border shrink-0 ${selectedDisaster===d.id ? 'bg-red-600 border-red-400 text-white shadow-md' : 'bg-slate-900 border-slate-800 text-slate-300'}`}
                    >
                      {d.icon} {lang === 'en' ? d.name.split(' ')[0] : d.nameHi}
                    </button>
                  ))}
                </div>

                {(() => {
                  const d = DISASTERS_MAP[selectedDisaster] || DISASTERS_MAP.flood;
                  return (
                    <div className="space-y-3">
                      <div className="p-4 rounded-2xl bg-gradient-to-r from-red-950 via-[#1e131b] to-slate-900 border border-red-800 p-4 space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <span className="text-[10px] font-black uppercase bg-red-600 text-white px-2 py-0.5 rounded">{d.severity}</span>
                            <h2 className="text-xl font-black text-white mt-1">{d.icon} {lang === 'en' ? d.name : d.nameHi}</h2>
                          </div>
                          <button onClick={() => handleVoiceGuidance(d.id)} className="p-2.5 rounded-xl bg-slate-900 border border-slate-700 text-xs font-bold text-slate-200">
                            🔊 {speaking ? 'Stop' : 'Voice'}
                          </button>
                        </div>
                      </div>

                      {/* 1-2-3 Action Badges */}
                      <div className="space-y-2">
                        <div className="text-xs font-bold uppercase text-red-400">WHAT TO DO NOW (1-2-3 Action)</div>
                        {d.actions.map((act, i) => (
                          <div key={i} className="p-3.5 rounded-2xl bg-[#141624] border border-slate-800 flex items-start gap-3 shadow-md">
                            <div className="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/40 text-red-400 flex items-center justify-center font-black text-xs shrink-0">
                              {act.badge}
                            </div>
                            <div>
                              <div className="text-xs font-bold text-white">{act.title}</div>
                              <div className="text-xs text-slate-300 leading-relaxed">{act.desc}</div>
                            </div>
                          </div>
                        ))}
                      </div>

                      {/* DO NOT warnings */}
                      <div className="p-4 rounded-2xl bg-red-950/30 border border-red-800 space-y-1.5">
                        <div className="text-xs font-black text-red-400 uppercase">❌ DO NOT</div>
                        {d.donts.map((dt, i) => (
                          <div key={i} className="text-xs text-red-200 flex items-start gap-2">
                            <span>•</span>
                            <span>{dt}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ========================================== */}
            {/* TAB 3: LIVE DISASTER MAP & SAFE PLACES */}
            {/* ========================================== */}
            {!subView && tab === 'map' && (
              <div className="space-y-3 animate-fadeIn">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-base font-black text-white flex items-center gap-1.5">
                      <span>🗺️</span> Live Safe Places & Evacuation Map
                    </h2>
                    <p className="text-[10px] text-slate-400">Color-coded disaster zones & live shelter routing</p>
                  </div>
                  <span className="text-[10px] font-bold text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">GPS Live</span>
                </div>

                {/* Leaflet Map */}
                <div ref={mapRef} className="w-full h-80 rounded-2xl border border-slate-800 overflow-hidden bg-slate-950 shadow-xl"></div>

                {/* Nearest Shelter Card */}
                <div className="p-4 rounded-2xl bg-gradient-to-r from-emerald-950/60 to-slate-900 border border-emerald-800 space-y-2">
                  <div className="flex justify-between items-center">
                    <span className="text-[10px] font-black uppercase text-emerald-400 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-700">NEAREST SAFE HAVEN</span>
                    <span className="text-xs font-bold text-emerald-300">1.8 km (8 mins)</span>
                  </div>
                  <div className="font-extrabold text-white text-sm">Thyagaraj Multi-Purpose Relief Shelter</div>
                  <div className="text-xs text-slate-300">Capacity: 3,500 beds • Medical Staff Ready • Power Backup ✅</div>

                  <div className="flex items-center gap-2 pt-1">
                    <a href="tel:011-24601111" className="flex-1 py-2 bg-slate-800 text-white font-bold text-xs rounded-xl text-center border border-slate-700">
                      📞 Call Shelter Desk
                    </a>
                    <a
                      href={`https://maps.google.com/?q=28.5804,77.2162`}
                      target="_blank"
                      className="py-2 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow-md text-center"
                    >
                      🧭 Google Route
                    </a>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ========================================== */}
          {/* BOTTOM NAVIGATION BAR */}
          {/* ========================================== */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#0c0e18]/95 backdrop-blur-xl border-t border-slate-800 p-2 flex justify-around items-center z-40">
            <button onClick={() => { setTab('home'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab==='home'?'text-red-400':'text-slate-400'}`}>
              <span className="text-lg">🏠</span>
              <span className="text-[10px]">Dashboard</span>
            </button>

            <button onClick={() => { setTab('emergency'); setSubView(null); }} className="relative -top-3 flex flex-col items-center">
              <div className="w-13 h-13 p-3 bg-gradient-to-tr from-red-600 to-rose-600 rounded-2xl text-white shadow-xl shadow-red-600/50 flex items-center justify-center font-bold text-xl">
                🚨
              </div>
              <span className="text-[10px] font-bold text-red-400 mt-0.5">Emergency</span>
            </button>

            <button onClick={() => setSubView('ai_predict')} className={`flex flex-col items-center text-xs font-bold ${subView==='ai_predict'?'text-purple-400':'text-slate-400'}`}>
              <span className="text-lg">🤖</span>
              <span className="text-[10px]">AI Risk</span>
            </button>

            <button onClick={() => { setTab('map'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab==='map'?'text-blue-400':'text-slate-400'}`}>
              <span className="text-lg">🗺️</span>
              <span className="text-[10px]">Live Map</span>
            </button>
          </nav>

          {/* ========================================== */}
          {/* FULLSCREEN HIGH-URGENCY SOS MODAL */}
          {/* ========================================== */}
          {sosOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-xl p-4 flex flex-col justify-between">
              <div className="flex justify-between items-center pt-2">
                <span className="text-xs font-black text-red-500 uppercase tracking-widest animate-pulse">🚨 EMERGENCY SOS ACTIVATED</span>
                <button onClick={() => { audio.stopSiren(); setSosOpen(false); }} className="px-3 py-1 bg-slate-800 text-slate-200 text-xs font-bold rounded-lg">Close</button>
              </div>

              <div className="text-center space-y-4 my-auto">
                <div className="w-36 h-36 mx-auto rounded-full bg-gradient-to-tr from-red-600 to-rose-700 flex items-center justify-center text-white font-black text-4xl shadow-[0_0_50px_rgba(239,68,68,0.9)] animate-pulse">
                  SOS
                </div>
                <h2 className="text-xl font-black text-white">Distress GPS Locked</h2>
                <div className="inline-block p-2 bg-slate-900 rounded-xl text-xs text-slate-300 font-mono border border-slate-800">
                  📍 {gpsCoords.lat.toFixed(5)}° N, {gpsCoords.lng.toFixed(5)}° E (±4m)
                </div>

                {/* 1-Tap SMS & WhatsApp Dispatch */}
                <div className="grid grid-cols-2 gap-2 max-w-xs mx-auto pt-2">
                  <a
                    href={`https://api.whatsapp.com/send?text=${encodeURIComponent(emergencySmsText)}`}
                    target="_blank"
                    className="p-3 bg-emerald-600 text-white font-bold text-xs rounded-xl text-center shadow-lg shadow-emerald-600/30"
                  >
                    💬 WhatsApp SOS
                  </a>
                  <a
                    href={`sms:112?body=${encodeURIComponent(emergencySmsText)}`}
                    className="p-3 bg-blue-600 text-white font-bold text-xs rounded-xl text-center shadow-lg shadow-blue-600/30"
                  >
                    📱 SMS to 112
                  </a>
                </div>

                <button
                  onClick={handleToggleSiren}
                  className="w-full py-3 bg-slate-800 text-amber-400 font-bold text-xs rounded-xl border border-slate-700"
                >
                  {sirenActive ? 'Mute Siren Tone' : '🔊 Play High-Decibel Siren Audio'}
                </button>
              </div>

              <div className="text-center text-xs text-slate-500 pb-2">
                Offline Auto-Sync Queue: Active • SDRF Emergency Mesh
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
