    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.osc = null;
        this.gain = null;
        this.active = false;
        this.interval = null;
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playChime(freq = 880, dur = 140) {
        this.init();
        if (!this.ctx) return;
        try {
          const o = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, this.ctx.currentTime);
          g.gain.setValueAtTime(0.18, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur / 1000);
          o.connect(g);
          g.connect(this.ctx.destination);
          o.start();
          o.stop(this.ctx.currentTime + dur / 1000);
        } catch(e) {}
      }
      startSiren() {
        if (this.active) return;
        this.init();
        if (!this.ctx) return;
        try {
          this.active = true;
          this.osc = this.ctx.createOscillator();
          this.gain = this.ctx.createGain();
          this.osc.type = 'sawtooth';
          this.gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          this.osc.connect(this.gain);
          this.gain.connect(this.ctx.destination);
          let freq = 500;
          let up = true;
          this.osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          this.osc.start();
          this.interval = setInterval(() => {
            if (!this.ctx || !this.osc) return;
            if (up) { freq += 50; if (freq >= 1250) up = false; }
            else { freq -= 50; if (freq <= 480) up = true; }
            this.osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          }, 35);
        } catch(e) {}
      }
      stopSiren() {
        if (!this.active) return;
        this.active = false;
        if (this.interval) clearInterval(this.interval);
        if (this.osc) {
          try { this.osc.stop(); this.osc.disconnect(); } catch(e) {}
          this.osc = null;
        }
      }
      speak(text, lang = 'en') {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const utt = new SpeechSynthesisUtterance(text);
        utt.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
        utt.rate = 0.95;
        window.speechSynthesis.speak(utt);
      }
      stopSpeaking() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

                            </div>
                            <div className="text-xs text-slate-300 leading-snug">{d.whatHappened}</div>
                          </div>

                          {/* 1-2-3 Action Badges */}
                          <div className="space-y-2">
                            <div className="text-xs font-bold uppercase text-slate-400">WHAT TO DO NOW (1-2-3 Action)</div>
                            {d.actions.map((act, i) => (
                              <div key={i} className="p-3.5 rounded-2xl white-glass flex items-start gap-3 shadow-md">
                                <div className="w-10 h-10 rounded-xl bg-white text-slate-950 flex items-center justify-center font-black text-xs shrink-0 shadow-md">
                                  {act.badge}
                                </div>
                                <div>
                                  <div className="text-xs font-bold text-white">{act.title}</div>
                                  <div className="text-xs text-slate-300 leading-relaxed">{act.desc}</div>
                                </div>
                              </div>
                            ))}
                          </div>

                          {/* Before, During, After Accordion */}
                          <div className="p-4 rounded-2xl white-glass space-y-2">
                            <div className="text-xs font-black text-white uppercase">📋 Complete Disaster Checklist</div>
                            <div className="text-xs text-slate-300"><span className="font-bold text-amber-300">Before:</span> {d.actionGuide.before}</div>
                            <div className="text-xs text-slate-300"><span className="font-bold text-rose-300">During:</span> {d.actionGuide.during}</div>
                            <div className="text-xs text-slate-300"><span className="font-bold text-emerald-300">After:</span> {d.actionGuide.after}</div>
                          </div>

                          {/* DO NOT warnings */}
                          <div className="p-4 rounded-2xl bg-rose-950/40 border border-rose-800 space-y-1.5">
                            <div className="text-xs font-black text-rose-300 uppercase">❌ CRITICAL DO NOTS</div>
                            {d.donts.map((dt, i) => (
                              <div key={i} className="text-xs text-rose-200 flex items-start gap-2">
                                <span>•</span>
                                <span>{dt}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })()}
                  </div>
                )}

                {/* ─────────────────────────────────────────── */}
                {/* TAB 3: LIVE DISASTER MAP & SHELTERS */}
                {/* ─────────────────────────────────────────── */}
                {!subView && tab === 'map' && (
                  <div className="space-y-3 animate-fadeIn">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-base font-black text-white flex items-center gap-1.5">
                          <span>🗺️</span> Live Safe Shelters & Evacuation Map
                        </h2>
                        <p className="text-[10px] text-slate-400">Color-coded disaster zones & dynamic detours</p>
                      </div>
                      <span className="text-[10px] font-bold text-emerald-300 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-800">GPS Live</span>
                    </div>

                    {/* Leaflet Map */}
                    <div ref={mapRef} className="w-full h-80 rounded-2xl border border-white/20 overflow-hidden bg-slate-950 shadow-2xl"></div>

                    {/* Detour Switcher */}
                    <div className="p-3.5 rounded-2xl white-glass space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold text-white">Target Safe Haven: <span className="text-emerald-300">Thyagaraj Shelter (1.8 km)</span></span>
                        <span className="text-[10px] font-mono text-slate-400">8 min route</span>
                      </div>
                      <button
                        onClick={() => {
                          setEvacDetourActive(!evacDetourActive);
                          audio.playChime(950, 100);
                        }}
                        className={`w-full py-2.5 rounded-xl font-bold text-xs border transition-all ${evacDetourActive ? 'bg-emerald-600 text-white border-emerald-400' : 'bg-white/10 text-white border-white/20'}`}
                      >
                        {evacDetourActive ? '✅ Active: Elevated Ring Road Detour (Underpass Avoided)' : '⚠️ Simulate Underpass Hazard: Click to Reroute'}
                      </button>
                    </div>

                    {/* Nearest Safe Place Card */}
                    <div className="p-4 rounded-2xl white-glass space-y-2">
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] font-black uppercase text-emerald-300 bg-emerald-950 px-2 py-0.5 rounded border border-emerald-700">NEAREST RELIEF REFUGE</span>
                        <span className="text-xs font-bold text-emerald-300">1.8 km away</span>
                      </div>
                      <div className="font-extrabold text-white text-sm">Thyagaraj Multi-Purpose Relief Shelter</div>
                      <div className="text-xs text-slate-300">Capacity: 3,500 beds • Medical Staff Ready • Generator Power Backup ✅</div>

                      <div className="flex items-center gap-2 pt-1">
                        <a href="tel:011-24601111" className="flex-1 py-2 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded-xl text-center border border-white/20">
                          📞 Call Shelter
                        </a>
                        <a
                          href={`https://maps.google.com/?q=28.5804,77.2162`}
                          target="_blank"
                          className="py-2 px-4 bg-white text-slate-950 font-black text-xs rounded-xl shadow-md text-center"
                        >
                          🧭 Open Navigation
                        </a>
                      </div>
                    </div>
                  </div>
                )}
              </>
            )}

          </main>

          {/* ========================================== */}
          {/* BOTTOM NAVIGATION BAR */}
          {/* ========================================== */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-[#090b14]/95 backdrop-blur-xl border-t border-white/10 p-2 flex justify-around items-center z-40">
            <button onClick={() => { setAppRole('citizen'); setTab('home'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab === 'home' && !subView ? 'text-white' : 'text-slate-400'}`}>
              <span className="text-lg">🏠</span>
              <span className="text-[10px]">Home</span>
            </button>

            <button onClick={() => { setAppRole('citizen'); setTab('emergency'); setSubView(null); }} className="relative -top-3 flex flex-col items-center">
              <div className="w-13 h-13 p-3 bg-gradient-to-tr from-rose-600 via-rose-500 to-indigo-600 rounded-2xl text-white shadow-xl shadow-rose-600/40 flex items-center justify-center font-bold text-xl border border-white/20">
                🚨
              </div>
              <span className="text-[10px] font-bold text-white mt-0.5">Emergency</span>
            </button>

            <button onClick={() => { setAppRole('citizen'); setSubView('ai_predict'); }} className={`flex flex-col items-center text-xs font-bold ${subView === 'ai_predict' ? 'text-indigo-400' : 'text-slate-400'}`}>
              <span className="text-lg">🤖</span>
              <span className="text-[10px]">AI Risk</span>
            </button>

            <button onClick={() => { setAppRole('citizen'); setTab('map'); setSubView(null); }} className={`flex flex-col items-center text-xs font-bold ${tab === 'map' && !subView ? 'text-cyan-400' : 'text-slate-400'}`}>
              <span className="text-lg">🗺️</span>
              <span className="text-[10px]">Map</span>
            </button>
          </nav>

          {/* ========================================== */}
          {/* HIGH-URGENCY FULLSCREEN SOS MODAL */}
          {/* ========================================== */}
          {sosOpen && (
            <div className="fixed inset-0 z-50 bg-black/95 backdrop-blur-2xl p-4 flex flex-col justify-between">
              <div className="flex justify-between items-center pt-2">
                <span className="text-xs font-black text-rose-500 uppercase tracking-widest animate-pulse">🚨 EMERGENCY SOS ACTIVATED</span>
                <button onClick={() => { audio.stopSiren(); setSosOpen(false); }} className="px-3 py-1 bg-white/10 text-white text-xs font-bold rounded-lg border border-white/20">Close</button>
              </div>

              <div className="text-center space-y-4 my-auto">
                <div className="w-36 h-36 mx-auto rounded-full bg-gradient-to-tr from-rose-600 via-rose-500 to-indigo-600 flex items-center justify-center text-white font-black text-4xl shadow-[0_0_50px_rgba(244,63,94,0.8)] animate-pulse border-4 border-white">
                  SOS
                </div>
                <h2 className="text-xl font-black text-white">Live GPS Distress Locked</h2>
                <div className="inline-block p-2.5 bg-white/[0.06] rounded-xl text-xs text-slate-200 font-mono border border-white/20">
                  📍 {gpsCoords.lat.toFixed(5)}° N, {gpsCoords.lng.toFixed(5)}° E (±4m Accuracy)
                </div>

                {/* 1-Tap SMS & WhatsApp Dispatch */}
                <div className="grid grid-cols-2 gap-2 max-w-xs mx-auto pt-2">
                  <a
                    href={`https://api.whatsapp.com/send?text=${encodeURIComponent(emergencySmsText)}`}
                    target="_blank"
                    className="p-3 bg-emerald-600 text-white font-black text-xs rounded-xl text-center shadow-lg shadow-emerald-600/30"
                  >
                    💬 WhatsApp SOS
                  </a>
                  <a
                    href={`sms:112?body=${encodeURIComponent(emergencySmsText)}`}
                    className="p-3 bg-white text-slate-950 font-black text-xs rounded-xl text-center shadow-lg shadow-white/30"
                  >
                    📱 SMS to 112
                  </a>
                </div>

                <button
                  onClick={handleToggleSiren}
                  className="w-full py-3 bg-white/10 hover:bg-white/20 text-white font-bold text-xs rounded-xl border border-white/20"
                >
                  {sirenActive ? 'Mute Siren Tone' : '🔊 Play High-Decibel Siren Synth'}
                </button>
              </div>

              <div className="text-center text-xs text-slate-400 pb-2 font-mono">
                Offline Auto-Sync Queue: Active • SDRF / NDRF Mesh Ready
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
